name: HOMEGUARD CI
on:
  push:
    branches: [main, "feat/**", "security/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: homeguard-simulate --seed 89 --output homeguard-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: homeguard-simulation-report
          path: homeguard-report.json
          retention-days: 7
